name: Android — EAS Build & Google Play

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Submit Android
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node + pnpm ────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 3. EAS Build + Submit Android ─────────────────────────────────────
      # google-play-key.json is already in artifacts/mobile/ (checked in).
      # eas.json production profile: buildType=app-bundle, track=internal.
      - name: EAS Build & Submit (Android production)
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --platform android \
            --profile production \
            --non-interactive \
            --auto-submit
