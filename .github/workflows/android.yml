name: Android — EAS Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android (EAS cloud)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Builds an Android App Bundle (.aab) on EAS cloud servers.
      # Download from https://expo.dev/accounts/muelsa89/projects/mobile/builds
      # then upload to Google Play Console → Internal testing.
      - name: EAS Build (Android production)
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --platform android \
            --profile production \
            --non-interactive
