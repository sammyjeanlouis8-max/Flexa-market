name: Android — EAS Build & Google Play

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Submit Android
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node + pnpm (via corepack — respects packageManager field) ─────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install

      # ── 3. EAS Build + Submit Android ─────────────────────────────────────
      # google-play-key.json is already in artifacts/mobile/ (checked in).
      # eas.json production profile: buildType=app-bundle, track=internal.
      - name: EAS Build & Submit (Android production)
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --platform android \
            --profile production \
            --non-interactive \
            --auto-submit
