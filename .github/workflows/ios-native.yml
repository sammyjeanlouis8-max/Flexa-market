name: Legacy Apple review selection — read only
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/inspect-legacy-review.rb
          sparse-checkout-cone-mode: false
      - name: Verify syntax
        run: ruby -c tools/inspect-legacy-review.rb
      - name: Read legacy App Store version and build 98
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: ruby tools/inspect-legacy-review.rb