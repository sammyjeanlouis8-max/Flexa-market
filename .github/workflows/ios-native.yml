name: Apple subscriptions — read-only inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    name: Inspect Apple subscriptions — no build or store writes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/inspect-apple-subscriptions.rb
          sparse-checkout-cone-mode: false
      - name: Validate read-only diagnostic syntax
        run: ruby -c tools/inspect-apple-subscriptions.rb
      - name: Read only app-specific subscription metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: ruby tools/inspect-apple-subscriptions.rb