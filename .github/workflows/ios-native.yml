name: iOS Native — Build & TestFlight

# Trigger manually from GitHub → Actions tab
on:
  schedule:
    - cron: '10 7 * * *'  # 07:10 UTC = midnight Pacific (auto-upload when Apple limit resets)
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to TestFlight
    runs-on:
  schedule:
    - cron: '10 7 * * *'  # 07:10 UTC = midnight Pacific (auto-upload when Apple limit resets) macos-latest      # Xcode 26+ with iOS 26 SDK (required by App Store)

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Generate all icon sizes on macOS CI using sips (avoids Linux/ImageMagick format issues) ──
      - name: Generate app icons with sips
        run: |
          SRC=artifacts/mobile/assets/images/icon.png
          D=artifacts/ios-native/Assets.xcassets/AppIcon.appiconset
          # All sizes referenced in Contents.json — must match exactly
          sips -z 1024 1024 "$SRC" --out "$D/icon-1024.png"
          sips -z 180  180  "$SRC" --out "$D/AppIcon180.png"
          sips -z 167  167  "$SRC" --out "$D/AppIcon167.png"
          sips -z 152  152  "$SRC" --out "$D/AppIcon152.png"
          sips -z 120  120  "$SRC" --out "$D/AppIcon120.png"
          sips -z 87   87   "$SRC" --out "$D/AppIcon87.png"
          sips -z 80   80   "$SRC" --out "$D/AppIcon80.png"
          sips -z 76   76   "$SRC" --out "$D/AppIcon76.png"
          sips -z 60   60   "$SRC" --out "$D/AppIcon60.png"
          sips -z 58   58   "$SRC" --out "$D/AppIcon58.png"
          sips -z 40   40   "$SRC" --out "$D/AppIcon40.png"
          sips -z 29   29   "$SRC" --out "$D/AppIcon29.png"
          sips -z 20   20   "$SRC" --out "$D/AppIcon20.png"
          echo "Icons generated:"
          ls -la "$D/"

      # ── 3. Install xcodegen ───────────────────────────────────────────────
      - name: Install xcodegen
        run: brew install xcodegen

      # ── 4. Generate .xcodeproj from project.yml ──────────────────────────
      - name: Generate Xcode project
        working-directory: artifacts/ios-native
        run: xcodegen generate

      # ── 5. Install fastlane ───────────────────────────────────────────────
      - name: Install fastlane
        run: gem install fastlane --no-document

      # ── 6. Revoke stale iOS Distribution certs (Apple allows max 2) ──────
      #   Each CI run starts with a clean keychain so old certs' private keys
      #   are gone and Apple won't issue a 3rd cert. Revoke them first so
      #   get_certificates can create a fresh one.
      - name: Revoke old Distribution certificates
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 - <<'PYEOF'
          import os, json, time, base64, urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec, utils as asym_utils

          def make_jwt():
              key_pem = os.environ["ASC_KEY_P8"].encode()
              private_key = serialization.load_pem_private_key(key_pem, password=None)
              now = int(time.time())
              hdr = base64.urlsafe_b64encode(json.dumps({
                  "alg": "ES256", "kid": os.environ["ASC_KEY_ID"], "typ": "JWT"
              }, separators=(',',':')).encode()).rstrip(b'=').decode()
              pld = base64.urlsafe_b64encode(json.dumps({
                  "iss": os.environ["ASC_ISSUER_ID"], "iat": now,
                  "exp": now + 1200, "aud": "appstoreconnect-v1"
              }, separators=(',',':')).encode()).rstrip(b'=').decode()
              to_sign = f"{hdr}.{pld}".encode()
              der_sig = private_key.sign(to_sign, ec.ECDSA(hashes.SHA256()))
              r, s = asym_utils.decode_dss_signature(der_sig)
              sig = base64.urlsafe_b64encode(
                  r.to_bytes(32,'big') + s.to_bytes(32,'big')
              ).rstrip(b'=').decode()
              return f"{hdr}.{pld}.{sig}"

          token = make_jwt()
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          # List both IOS_DISTRIBUTION (legacy) and DISTRIBUTION (Apple Distribution, newer)
          certs = []
          for cert_type in ["IOS_DISTRIBUTION", "DISTRIBUTION"]:
              url = f"https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]={cert_type}&limit=20"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  certs += json.loads(r.read()).get("data", [])

          print(f"Found {len(certs)} IOS_DISTRIBUTION certificate(s)")
          for cert in certs:
              cid = cert["id"]
              del_req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/certificates/{cid}",
                  method="DELETE", headers=headers
              )
              try:
                  urllib.request.urlopen(del_req)
                  print(f"  ✓ Revoked {cid}")
              except urllib.error.HTTPError as e:
                  print(f"  ✗ {cid}: {e.code} {e.reason}")
          PYEOF

      # ── 7. Build + sign + upload via fastlane ────────────────────────────
      - name: Build & Upload to TestFlight
        working-directory: artifacts/ios-native
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          FASTLANE_HIDE_TIMESTAMP: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
        run: fastlane build_and_upload

      # ── 8. Upload gym raw build log + IPA as artifacts ────────────────────
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlexaMarket-iOS-logs
          path: |
            ~/Library/Logs/gym/
            /tmp/ipa_output/FlexaMarket.ipa
          retention-days: 3
