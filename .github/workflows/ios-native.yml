name: iOS Legacy — Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: "Signing diagnostic, Apple inventory, one-time certificate issuance, or release build"
        required: true
        default: diagnostic
        type: choice
        options:
          - diagnostic
          - native_import_diagnostic
          - apple_diagnostic
          - apple_inventory
          - create_ios_certificate_once
          - build
      certificate_confirmation:
        description: "Exact one-time issuance approval: CREATE_ONE_IOS_DISTRIBUTION_NO_REVOCATION"
        required: false
        default: ""
        type: string

jobs:
  signing_diagnostic:
    name: Signing preflight — no build or Apple requests
    if: ${{ inputs.signing_mode != 'apple_inventory' }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            artifacts/ios-native

      # Match the release job's gem/runtime setup without invoking fastlane.
      - name: Install release runtime dependencies
        run: gem install fastlane --no-document

      - name: Validate diagnostic syntax and synthetic cases
        shell: bash
        run: |
          set -euo pipefail
          ruby -c tools/check-ios-signing.rb
          ruby -c tools/check-ios-signing.test.rb
          ruby tools/check-ios-signing.test.rb
          ruby -c tools/create-ios-certificate-once.rb
          ruby -c tools/create-ios-certificate-once.test.rb
          ruby tools/create-ios-certificate-once.test.rb
          ruby -c tools/ios-signing-identity.rb
          ruby -c tools/ios-signing-identity.test.rb
          ruby tools/ios-signing-identity.test.rb
          ruby -c tools/ios-native-p12.rb
          ruby -c tools/ios-native-p12.test.rb
          ruby -c tools/check-ios-native-import.rb
          ruby tools/ios-native-p12.test.rb --native-import
          ruby -c artifacts/ios-native/fastlane/Fastfile
          ruby -c tools/ios-profile-options.test.rb
          ruby tools/ios-profile-options.test.rb

      - name: Verify native payment origin policy and Swift syntax
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse artifacts/ios-native/Sources/*.swift
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc -swift-version 5 -typecheck -sdk "$SDK" -target "$(uname -m)-apple-ios16.0-simulator" \
            artifacts/ios-native/Sources/HostedPaymentPolicy.swift \
            artifacts/ios-native/Sources/HostedPaymentViewController.swift
          TEST_DIR="$(mktemp -d)"
          cp tools/test-ios-hosted-payment.swift "$TEST_DIR/main.swift"
          swiftc artifacts/ios-native/Sources/HostedPaymentPolicy.swift "$TEST_DIR/main.swift" -o "$TEST_DIR/payment-policy"
          "$TEST_DIR/payment-policy"
          rm -rf "$TEST_DIR"

      - name: Check current signing secret pair
        env:
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        shell: bash
        run: ruby tools/check-ios-signing.rb

      - name: Verify actual identity imports natively without Apple requests
        if: ${{ inputs.signing_mode == 'native_import_diagnostic' }}
        env:
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        run: ruby tools/check-ios-native-import.rb

  apple_signing_diagnostic:
    name: Apple certificate read-only check — no build
    needs: signing_diagnostic
    if: ${{ inputs.signing_mode == 'apple_diagnostic' }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install diagnostic runtime
        run: gem install fastlane --no-document
      - name: Validate Apple diagnostic syntax and synthetic cases
        run: |
          ruby -c tools/check-apple-signing.rb
          ruby -c tools/check-apple-signing.test.rb
          ruby tools/check-apple-signing.test.rb
      - name: Read Apple certificate status without changing anything
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        run: ruby tools/check-apple-signing.rb

  apple_signing_inventory:
    name: Apple public signing metadata — read only
    if: ${{ inputs.signing_mode == 'apple_inventory' }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install diagnostic runtime
        run: gem install fastlane --no-document
      - name: Validate syntax and synthetic metadata tests
        shell: bash
        run: |
          set -euo pipefail
          ruby -c tools/check-apple-signing.rb
          ruby -c tools/check-apple-signing.test.rb
          ruby tools/check-apple-signing.test.rb
      - name: Read public certificate and app profile metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: ruby tools/check-apple-signing.rb --inventory

  create_ios_certificate_once:
    name: Create one approved iOS Distribution certificate — no build or profile writes
    needs: signing_diagnostic
    if: ${{ inputs.signing_mode == 'create_ios_certificate_once' && inputs.certificate_confirmation == 'CREATE_ONE_IOS_DISTRIBUTION_NO_REVOCATION' }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install certificate creation runtime
        run: gem install fastlane --no-document

      # These checks are deliberately complete before any Apple or P12 secrets
      # enter the process environment.
      - name: Validate certificate creation and native identity synthetics
        shell: bash
        run: |
          set -euo pipefail
          ruby -c tools/create-ios-certificate-once.rb
          ruby -c tools/create-ios-certificate-once.test.rb
          ruby tools/create-ios-certificate-once.test.rb
          ruby -c tools/check-apple-signing.rb
          ruby -c tools/check-apple-signing.test.rb
          ruby tools/check-apple-signing.test.rb
          ruby -c tools/ios-signing-identity.rb
          ruby -c tools/ios-signing-identity.test.rb
          ruby tools/ios-signing-identity.test.rb
          ruby -c artifacts/ios-native/fastlane/Fastfile

      - name: Create exactly one approved certificate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          CERTIFICATE_CONFIRMATION: ${{ inputs.certificate_confirmation }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: ruby tools/create-ios-certificate-once.rb

      - name: Upload encrypted verified public certificate only
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: verified-ios-distribution-certificate-encrypted
          path: .local/issued-ios-certificate.encrypted.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build & Upload to TestFlight
    needs: signing_diagnostic
    if: ${{ inputs.signing_mode == 'build' }}
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            artifacts/ios-native
            artifacts/mobile/assets/images

      # ── 2. Generate app icons on macOS CI ─────────────────────────────────
      - name: Generate app icons with sips
        shell: bash
        run: |
          set -euo pipefail

          SRC="artifacts/mobile/assets/images/icon.png"
          DEST="artifacts/ios-native/Assets.xcassets/AppIcon.appiconset"

          test -f "$SRC"
          test -d "$DEST"

          sips -z 1024 1024 "$SRC" --out "$DEST/icon-1024.png"
          sips -z 180 180 "$SRC" --out "$DEST/AppIcon180.png"
          sips -z 167 167 "$SRC" --out "$DEST/AppIcon167.png"
          sips -z 152 152 "$SRC" --out "$DEST/AppIcon152.png"
          sips -z 120 120 "$SRC" --out "$DEST/AppIcon120.png"
          sips -z 87 87 "$SRC" --out "$DEST/AppIcon87.png"
          sips -z 80 80 "$SRC" --out "$DEST/AppIcon80.png"
          sips -z 76 76 "$SRC" --out "$DEST/AppIcon76.png"
          sips -z 60 60 "$SRC" --out "$DEST/AppIcon60.png"
          sips -z 58 58 "$SRC" --out "$DEST/AppIcon58.png"
          sips -z 40 40 "$SRC" --out "$DEST/AppIcon40.png"
          sips -z 29 29 "$SRC" --out "$DEST/AppIcon29.png"
          sips -z 20 20 "$SRC" --out "$DEST/AppIcon20.png"

          echo "Generated app icons:"
          ls -la "$DEST"

      # ── 3. Install xcodegen ───────────────────────────────────────────────
      - name: Install xcodegen
        run: brew install xcodegen

      # ── 4. Generate the Xcode project ─────────────────────────────────────
      - name: Generate Xcode project
        working-directory: artifacts/ios-native
        run: xcodegen generate

      # ── 5. Install fastlane ───────────────────────────────────────────────
      - name: Install fastlane
        run: gem install fastlane --no-document

      # ── 6. Build with an existing signing certificate; never revoke one ───
      - name: Build & Upload to TestFlight
        working-directory: artifacts/ios-native
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          FASTLANE_HIDE_TIMESTAMP: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
        shell: bash
        run: fastlane build_and_upload

      # ── 7. Keep build logs and IPA available for troubleshooting ──────────
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlexaMarket-iOS-logs
          path: |
            ~/Library/Logs/gym/
            /tmp/ipa_output/FlexaMarket.ipa
          if-no-files-found: warn
          retention-days: 3
