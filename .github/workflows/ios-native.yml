name: iOS Native — Build & TestFlight

# Trigger manually from GitHub → Actions tab
on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to TestFlight
    runs-on: macos-15          # Xcode 16, arm64 runner

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Copy app icon from the existing mobile project ─────────────────
      - name: Copy app icon
        run: |
          cp artifacts/mobile/assets/images/icon.png \
             artifacts/ios-native/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      # ── 3. Install xcodegen ───────────────────────────────────────────────
      - name: Install xcodegen
        run: brew install xcodegen

      # ── 4. Generate .xcodeproj from project.yml ──────────────────────────
      - name: Generate Xcode project
        working-directory: artifacts/ios-native
        run: xcodegen generate

      # ── 5. Install fastlane ───────────────────────────────────────────────
      - name: Install fastlane
        run: gem install fastlane --no-document

      # ── 6. Build + sign + upload via fastlane ────────────────────────────
      - name: Build & Upload to TestFlight
        working-directory: artifacts/ios-native
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:    ${{ secrets.ASC_KEY_P8 }}
          FASTLANE_HIDE_TIMESTAMP: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
        run: fastlane build_and_upload

      # ── 7. Save IPA as artifact (backup) ──────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlexaMarket-iOS
          path: /tmp/ipa_output/FlexaMarket.ipa
          retention-days: 7
