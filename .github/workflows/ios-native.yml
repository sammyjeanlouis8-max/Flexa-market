name: iPhone notification fix — build only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare app icons
        shell: bash
        run: |
          set -euo pipefail
          SRC="artifacts/mobile/assets/images/icon.png"
          DEST="artifacts/ios-native/Assets.xcassets/AppIcon.appiconset"
          for spec in "1024:icon-1024" "180:AppIcon180" "167:AppIcon167" "152:AppIcon152" "120:AppIcon120" "87:AppIcon87" "80:AppIcon80" "76:AppIcon76" "60:AppIcon60" "58:AppIcon58" "40:AppIcon40" "29:AppIcon29" "20:AppIcon20"; do
            size="${spec%%:*}"
            name="${spec#*:}"
            sips -z "$size" "$size" "$SRC" --out "$DEST/$name.png" >/dev/null
          done
      - name: Install Xcode project generator
        run: brew install xcodegen
      - name: Generate project
        working-directory: artifacts/ios-native
        run: xcodegen generate
      - name: Install build tools
        run: gem install fastlane --no-document
      - name: Build signed IPA without uploading or submitting
        working-directory: artifacts/ios-native
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          FASTLANE_HIDE_TIMESTAMP: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
        run: fastlane build_only
      - name: Save signed IPA and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlexaMarket-iPhone-notifications-build97
          path: |
            /tmp/ipa_output/FlexaMarket.ipa
            ~/Library/Logs/gym/
          retention-days: 14
          if-no-files-found: warn