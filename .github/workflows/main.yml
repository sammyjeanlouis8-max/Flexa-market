name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch config for hoisted node_modules + add expo to root
        run: |
          echo "node-linker=hoisted" >> .npmrc
          sed -i 's/  excludeLinksFromLockfile: false/  excludeLinksFromLockfile: false\n  nodeLinker: hoisted/' pnpm-lock.yaml
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies = pkg.dependencies || {};
            pkg.dependencies['expo'] = '~54.0.35';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install workspace dependencies (updates lockfile with expo at root)
        run: NODE_ENV=development pnpm install --no-frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli@19.1.0

      - name: EAS local build
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          EXPO_ROUTER_APP_ROOT: app
        run: |
          set -o pipefail
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output /tmp/app.aab \
            2>&1 | tee /tmp/eas.log

      - name: Find and copy AAB
        run: |
          F=$(find /tmp artifacts/mobile -name "*.aab" 2>/dev/null | head -1)
          echo "AAB: $F"
          [ -n "$F" ] && cp "$F" /tmp/final.aab || (echo "No AAB found" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: flexa-market-android
          path: /tmp/final.aab
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/eas.log
          retention-days: 3
