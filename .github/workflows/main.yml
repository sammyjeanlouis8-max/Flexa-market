name: Build Android AAB (local, no EAS credits)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: NODE_ENV=development pnpm install --frozen-lockfile

      - name: Patch package.json (replace catalog: references)
        working-directory: artifacts/mobile
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const catalog = {
              '@tanstack/react-query': '^5.90.21',
              'react': '19.1.0',
              'react-dom': '19.1.0',
              'zod': '3.25.76'
            };
            for (const section of ['dependencies', 'devDependencies']) {
              if (!pkg[section]) continue;
              for (const [k, v] of Object.entries(pkg[section])) {
                if (v === 'catalog:' && catalog[k]) {
                  pkg[section][k] = catalog[k];
                }
              }
            }
            pkg.name = 'flexa-market';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('Patched package.json successfully');
          "

      - name: Install EAS CLI
        run: npm install -g eas-cli@19.1.0

      - name: Build Android AAB (local)
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_DOMAIN: lionfish-app-feohg.ondigitalocean.app
        run: |
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output /tmp/flexa-market.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexa-market-android
          path: /tmp/flexa-market.aab
          retention-days: 7
