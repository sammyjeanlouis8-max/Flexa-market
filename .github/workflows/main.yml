      - name: Find and move AAB
        if: success()
        run: |
          AAB=$(find /tmp/mobile-build /tmp -name "*.aab" 2>/dev/null | head -1)
          echo "Found: $AAB"
          if [ -n "$AAB" ]; then
            cp "$AAB" /tmp/flexa-market-final.aab
            echo "Copied to /tmp/flexa-market-final.aab"
          else
            echo "No AAB found!" && exit 1
          fi

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flexa-market-android
          path: /tmp/flexa-market-final.aab
          retention-days: 7
