name: Build Android AAB (local, no EAS credits)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;26.1.10909125" 2>&1 | tail -10

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: NODE_ENV=development pnpm install --frozen-lockfile

      - name: Prepare standalone mobile build directory
        run: |
          mkdir -p /tmp/mobile-build
          rsync -av --exclude=node_modules --exclude=android --exclude=ios \
            artifacts/mobile/ /tmp/mobile-build/
          cd /tmp/mobile-build
          sed -i 's|"@tanstack/react-query": "catalog:"|"@tanstack/react-query": "^5.90.21"|g' package.json
          sed -i 's|"react": "catalog:"|"react": "19.1.0"|g' package.json
          sed -i 's|"react-dom": "catalog:"|"react-dom": "19.1.0"|g' package.json
          sed -i 's|"zod": "catalog:"|"zod": "3.25.76"|g' package.json
          sed -i 's|"@workspace/mobile"|"flexa-market"|g' package.json
          npm install --legacy-peer-deps 2>&1 | tail -5

      - name: Install EAS CLI
        run: npm install -g eas-cli@19.1.0

      - name: Build Android AAB (local)
        working-directory: /tmp/mobile-build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_DOMAIN: lionfish-app-feohg.ondigitalocean.app
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output /tmp/flexa-market.aab \
            2>&1 | tee /tmp/eas-build.log || (cat /tmp/eas-build.log && exit 1)

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flexa-market-android
          path: /tmp/flexa-market.aab
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/eas-build.log
          retention-days: 3
