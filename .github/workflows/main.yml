name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: NODE_ENV=development pnpm install --frozen-lockfile
      - name: Prepare build dir
        run: |
          rsync -a --exclude=node_modules --exclude=android --exclude=ios artifacts/mobile/ /tmp/mb/
          cd /tmp/mb
          sed -i 's|"@tanstack/react-query": "catalog:"|"@tanstack/react-query": "^5.90.21"|g' package.json
          sed -i 's|"react": "catalog:"|"react": "19.1.0"|g' package.json
          sed -i 's|"react-dom": "catalog:"|"react-dom": "19.1.0"|g' package.json
          sed -i 's|"zod": "catalog:"|"zod": "3.25.76"|g' package.json
          sed -i 's|"@workspace/mobile"|"flexa-market"|g' package.json
          npm install --legacy-peer-deps 2>&1 | tail -3
      - run: npm install -g eas-cli@19.1.0
      - name: EAS build
        working-directory: /tmp/mb
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_DOMAIN: lionfish-app-feohg.ondigitalocean.app
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: eas build --platform android --profile production --local --non-interactive --output /tmp/app.aab
      - name: Find AAB
        run: |
          F=$(find /tmp /home -name "*.aab" 2>/dev/null | head -1)
          echo "Found=$F"
          cp "$F" /tmp/final.aab
      - uses: actions/upload-artifact@v4
        with:
          name: flexa-market-android
          path: /tmp/final.aab
          retention-days: 7
