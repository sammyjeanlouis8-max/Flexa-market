name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: NODE_ENV=development pnpm install --frozen-lockfile

      - name: Patch catalog references
        run: |
          cd artifacts/mobile
          sed -i 's|"@tanstack/react-query": "catalog:"|"@tanstack/react-query": "^5.90.21"|g' package.json
          sed -i 's|"react": "catalog:"|"react": "19.1.0"|g' package.json
          sed -i 's|"react-dom": "catalog:"|"react-dom": "19.1.0"|g' package.json
          sed -i 's|"zod": "catalog:"|"zod": "3.25.76"|g' package.json

      - name: Install EAS CLI
        run: npm install -g eas-cli@19.1.0

      - name: EAS local build
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output /tmp/app.aab \
            2>&1 | tee /tmp/eas.log

      - name: Find and copy AAB
        run: |
          F=$(find /tmp artifacts/mobile -name "*.aab" 2>/dev/null | head -1)
          echo "AAB: $F"
          [ -n "$F" ] && cp "$F" /tmp/final.aab || (echo "No AAB found" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: flexa-market-android
          path: /tmp/final.aab
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/eas.log
          retention-days: 3
