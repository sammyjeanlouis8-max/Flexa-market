name: Mobile release preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "artifacts/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-preflight.yml"
  push:
    branches:
      - main
    paths:
      - "artifacts/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-preflight.yml"

permissions:
  contents: read

concurrency:
  group: mobile-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile-release:
    name: Verify iOS release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release configuration
        run: pnpm --filter @workspace/mobile run release:check

      - name: Type-check mobile source
        run: pnpm --filter @workspace/mobile run typecheck

      - name: Check Expo dependency alignment
        run: CI=1 pnpm --filter @workspace/mobile exec expo install --check