name: FlexaMarket
options:
  bundleIdPrefix: app.replit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    PRODUCT_BUNDLE_IDENTIFIER: app.replit.flexamarket
    # RevenueCat's public iOS SDK key for the app.replit.flexamarket app.
    # This key is included in the client binary; it is not a server secret.
    REVENUECAT_IOS_API_KEY: "appl_nslOoUgWFDwUzhKpOjpwYxNZbmL"
    DEVELOPMENT_TEAM: D782MM56VY
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "95"
    GENERATE_INFOPLIST_FILE: NO

targets:
  FlexaMarket:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
      - path: Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.replit.flexamarket
      DEVELOPMENT_TEAM: D782MM56VY
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      INFOPLIST_FILE: Sources/Info.plist
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_ENTITLEMENTS: Sources/FlexaMarket.entitlements
    dependencies:
      - package: RevenueCat
        product: RevenueCat
