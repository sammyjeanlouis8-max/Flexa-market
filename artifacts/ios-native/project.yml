name: FlexaMarket
options:
  bundleIdPrefix: com.flexamarket
  deploymentTarget:
    iOS: "15.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.1"
    PRODUCT_BUNDLE_IDENTIFIER: com.flexamarket.mobile
    DEVELOPMENT_TEAM: D782MM56VY
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "64"

targets:
  FlexaMarket:
    type: application
    platform: iOS
    deploymentTarget: "15.1"
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.flexamarket.mobile
      DEVELOPMENT_TEAM: D782MM56VY
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_FILE: Sources/Info.plist
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "15.1"
