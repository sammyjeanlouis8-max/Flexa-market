name: FlexaMarket
options:
  bundleIdPrefix: com.flexamarket
  deploymentTarget:
    iOS: "15.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.1"
    PRODUCT_BUNDLE_IDENTIFIER: com.flexamarket.mobile
    DEVELOPMENT_TEAM: D782MM56VY
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "65"
    GENERATE_INFOPLIST_FILE: NO

targets:
  FlexaMarket:
    type: application
    platform: iOS
    deploymentTarget: "15.1"
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Assets.xcassets
      # Individual file refs → each PNG lands at the bundle ROOT (not a subdirectory)
      # altool checks the bundle root for legacy icon sizes
      - path: Icons/AppIcon120.png
      - path: Icons/AppIcon180.png
      - path: Icons/AppIcon152.png
      - path: Icons/AppIcon167.png
      - path: Icons/AppIcon87.png
      - path: Icons/AppIcon80.png
      - path: Icons/AppIcon58.png
      - path: Icons/AppIcon40.png
      - path: Icons/AppIcon76.png
      - path: Icons/AppIcon60.png
      - path: Icons/AppIcon29.png
      - path: Icons/AppIcon20.png
      # @2x/@3x named aliases for CFBundleIconFiles resolution
      - path: Icons/AppIcon60x60@2x.png
      - path: Icons/AppIcon60x60@3x.png
      - path: Icons/AppIcon76x76@2x.png
      - path: Icons/AppIcon83.5x83.5@2x.png
      - path: Icons/AppIcon29x29@2x.png
      - path: Icons/AppIcon29x29@3x.png
      - path: Icons/AppIcon40x40@2x.png
      - path: Icons/AppIcon40x40@3x.png
      - path: Icons/AppIcon20x20@2x.png
      - path: Icons/AppIcon20x20@3x.png
      - path: Icons/AppIcon76x76@1x.png
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.flexamarket.mobile
      DEVELOPMENT_TEAM: D782MM56VY
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      INFOPLIST_FILE: Sources/Info.plist
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "15.1"
      GENERATE_INFOPLIST_FILE: NO
