    <script>
      /* ------------------------------------------------------------------ *
       * Badge suppressor — works even when Replit injects the element late  *
       * or uses unpredictable class / id names.                             *
       *                                                                     *
       * Strategy:                                                           *
       *   1. Selector sweep  — known class/id/tag patterns                 *
       *   2. Text sweep      — find "Made with Replit" text nodes,         *
       *                        remove nearest fixed/absolute ancestor      *
       *   3. MutationObserver — re-runs on every DOM addition              *
       *   4. setInterval     — polls every 400 ms for 30 s (shadow DOM /  *
       *                        async injection fallback)                    *
       * ------------------------------------------------------------------ */
      (function () {
        var SELECTORS = [
          '#replit-badge', '.replit-badge',
          '[class*="replit-badge"]', '[id*="replit-badge"]',
          '[class*="replit-ui"]',   '[id*="replit-ui"]',
          'iframe[src*="replit.com"]', 'iframe[src*="repl.it"]',
          'replit-badge', '[data-replit-badge]', '[data-cy="replit-badge"]'
        ];

        function removeBySelector() {
          SELECTORS.forEach(function (sel) {
            try {
              document.querySelectorAll(sel).forEach(function (el) { el.remove(); });
            } catch (_) {}
          });
          try {
            document.querySelectorAll('a[href*="replit.com"],a[href*="repl.it"]')

                var inlineStyle = el.getAttribute('style') || '';
                var cs = window.getComputedStyle && window.getComputedStyle(el);
                var pos = (cs && cs.position) || '';
                if (inlineStyle.indexOf('fixed') !== -1 ||
                    inlineStyle.indexOf('absolute') !== -1 ||
                    pos === 'fixed' || pos === 'absolute') {
                  var root = el;
                  while (root.parentElement && root.parentElement !== document.body) {
                    root = root.parentElement;

        }

        function removeByText() {
          try {
            var walker = document.createTreeWalker(
              document.documentElement,
              NodeFilter.SHOW_TEXT,
              null
            );
            var toRemove = [];
            var node;
            while ((node = walker.nextNode())) {

                var candidate = node.parentElement;
                var found = null;
                while (candidate && candidate !== document.body) {

                    if (pos === 'fixed' || pos === 'absolute') {
                      found = candidate;
                      break;
                    }

                  candidate = candidate.parentElement;
                }
                toRemove.push(found || node.parentElement);
              }
            }
            toRemove.forEach(function (el) {
              try { if (el && el.parentNode) el.remove(); } catch (_) {}
            });
          } catch (_) {}
        }

        function sweep() {
          removeBySelector();
          removeByText();
        }

        var observer = new MutationObserver(function (mutations) {
          var added = false;
          mutations.forEach(function (m) {
            m.addedNodes.forEach(function (n) { if (n.nodeType === 1) added = true; });
          });

        });

        function start() {
          sweep();
          observer.observe(document.documentElement, { childList: true, subtree: true });

          var ticks = 0;
          var timer = setInterval(function () {
            sweep();

    <script>
      (function () {
        var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
        var sat = 0;
        if (isIOS) {
          // screen.height in logical px (always portrait-native value)
          // >= 812 → iPhone X and all later models (notch or Dynamic Island)
          // Dynamic Island (iPhone 14 Pro+): ~59 px
          // Notch (iPhone X–14 regular): ~47 px
          // We use 59 for all modern iPhones — slightly generous but safe.
          sat = window.screen.height >= 812 ? 59 : 20;
        }
        document.documentElement.style.setProperty('--sat', sat + 'px');
      })();

        setTimeout(function () {

          if (sessionStorage.getItem('fm_self_heal_done')) {
            /* Already self-healed once this session — show retry link only */
            var link = document.getElementById('sk-retry');
            if (link) link.style.display = 'block';
            return;

          sessionStorage.setItem('fm_self_heal_done', '1');
          console.warn('[FLEXA] Self-healing: clearing SW + caches and reloading');
          Promise.all([
