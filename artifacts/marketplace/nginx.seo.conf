# Flexa Market SPA + crawler SEO (used by Dockerfile.marketplace).
# Googlebot and peers hitting /listings/:id or /categories/:slug receive
# crawlable HTML from the API. Humans receive the SPA shell.
#
# DigitalOcean App Platform splits ingress (/api → API, /* → this nginx).
# Component-to-component DNS (flexa-market:8080) is unreliable here, so SEO
# proxies go through the public HTTPS origin to /api/seo/* (routed to the API).

map $http_user_agent $flexa_is_seo_bot {
    default                 0;
    ~*(Googlebot|Google-InspectionTool|bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Applebot|Bytespider|GPTBot|ClaudeBot|CCBot|PetalBot) 1;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Runtime DNS for variable proxy_pass targets.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location ~ ^/listings/(?<listing_id>[0-9]+)$ {
        error_page 418 = @seo_listing;
        if ($flexa_is_seo_bot) { return 418; }
        try_files /index.html =404;
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    }

    location @seo_listing {
        internal;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host flexamarket.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header User-Agent "FlexaMarket-SEO-Proxy/1.0";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        set $flexa_seo_origin "https://flexamarket.com";
        proxy_pass $flexa_seo_origin/api/seo/listings/$listing_id;
    }

    location ~ ^/categories/(?<category_slug>[a-z0-9-]+)$ {
        error_page 418 = @seo_category;
        if ($flexa_is_seo_bot) { return 418; }
        try_files /index.html =404;
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    }

    location @seo_category {
        internal;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host flexamarket.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header User-Agent "FlexaMarket-SEO-Proxy/1.0";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        set $flexa_seo_origin "https://flexamarket.com";
        proxy_pass $flexa_seo_origin/api/seo/categories/$category_slug;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
