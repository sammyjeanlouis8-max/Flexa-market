plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.flexabackgroundupload'
version = '1.0.0'

android {
  namespace 'expo.modules.flexabackgroundupload'

  defaultConfig {
    minSdk 24
    // Expo's module publication plugin requires an explicit Android library
    // versionName during configuration, even for non-published local modules.
    versionName '1.0.0'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.work:work-runtime-ktx:2.9.0"
}